[package]
name = "kerub"
version = "0.2.0"
description = "Kerub: medidor de dano, histórico e personagens do AION 2"
edition = "2024"
# Linka o motor de captura, que é GPL-3.0.
license = "GPL-3.0-only"
repository = "https://github.com/londarks/Kerub"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Motor de captura: captura, parser e cálculo de dano, sem a parte online
# (conta, upload de logs, updater, Discord, overlay de OBS). Veja o README.
motor = { package = "a2tools-dps-meter", path = "../A2Tools-DPS-Meter/src-tauri", default-features = false, features = ["desktop"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
# Histórico e escolhas num arquivo SQLite em %APPDATA%. "bundled" compila o
# SQLite junto: nenhuma DLL a mais do lado do exe.
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Tecla Del (esconder/mostrar), download do instalador do Npcap e a API do
# site do AION 2 (WinHTTP). Mesma versão que o motor já compila.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_Networking_WinHttp",
] }

[profile.release]
strip = true
